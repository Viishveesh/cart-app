name: Hello # name

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  APP_NAME: "cart-app"

jobs:
  say-hello: #first job
    runs-on: ubuntu-latest # runner
    steps:
      - name: Checkout my code
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "Hello, World! This pipeline is triggered by ${{github.actor}} and this is the environment variable APP_NAME ${{env.APP_NAME}}. Hello, ${{vars.GREETING}}!"
  
  create-file: #second job
    needs: say-hello
    runs-on: ubuntu-latest
    steps:
      - name: Create a file
        run: echo "This is a new file created by Vishvesh" > newfile.txt
      - uses: actions/upload-artifact@v7
        with:
          name: newfile
          path: newfile.txt
  
  read-file:
    needs: create-file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: newfile
      - run: cat newfile.txt
        