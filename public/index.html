<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cart App</title>
  </head>
  <body>
    <h1>Cart App</h1>
    <p id="total">Loading...</p>
    <p>Version 1</p>
    <script type="module">
      import { subtotal, applyDiscount } from "./cart.js";

      const items = [
        { price: 10, quantity: 2 },
        { price: 5, quantity: 1 },
      ];
      const total = applyDiscount(subtotal(items), 10);
      document.getElementById("total").textContent =
        `Total after 10% off: $${total.toFixed(2)}`;
    </script>
  </body>
</html>
